image: python:3.9

before_script:
  - pip install -U pip  # Upgrade pip
  - pip install -r requirements.txt  # Install necessary dependencies

stages:
  - build
  - deploy

update_index:
  stage: build
  script:
    - python generate_homepage.py

pages:
  stage: deploy
  script:
    - "echo deploying!"
  artifacts:
    paths:
      - public
  only:
    variables:
      - $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
