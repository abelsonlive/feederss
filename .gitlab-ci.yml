image: python:3.9

variables:
  SITE_URL: "https://your-gitlab-pages-url.com" # Update with your GitLab Pages URL

before_script:
  - pip install -U pip  # Upgrade pip
  - pip install -r requirements.txt  # Install necessary dependencies

stages:
  - build
  - deploy

update_index:
  stage: build
  script:
    - python generate_homepage.py  # Replace with the name of your Python script
    - git config --global user.email "brian@abelson.live"
    - git config --global user.name "Brian Abelson"
    - git add public/index.html  # Stage the updated index.html
    - git commit -m "Update index.html"  # Commit the changes
    - git push origin $CI_COMMIT_BRANCH  # Push changes to the current branch

pages:
  stage: deploy
  script:
    - "echo deploying!"
  artifacts:
    paths:
      - public
  only:
    variables:
      - $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
